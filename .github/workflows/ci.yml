name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & self-check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (Debug, unsigned)
        run: |
          xcodebuild -project Slateflow.xcodeproj -scheme Slateflow \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Self-check
        run: build/Build/Products/Debug/Slateflow.app/Contents/MacOS/Slateflow --selftest

      # Release compiles without DEBUG code (the self-check) and for both architectures;
      # catch failures here rather than in Tools/make-dmg.sh. Unsigned: no secrets in CI.
      - name: Build (Release, universal, unsigned)
        run: |
          xcodebuild -project Slateflow.xcodeproj -scheme Slateflow \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
