name: Build & self-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap Ubuntu check first, so docs-only changes don't wait for a scarce macOS runner.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Anything besides docs changed?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (new branch, force push): build to be safe.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Docs, templates and the license can't change the build; anything else can.
          CODE="$(git diff --name-only "$BASE" "$GITHUB_SHA" \
            | grep -vE '\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/CODEOWNERS$|^LICENSE$' || true)"
          echo "code=$([[ -n "$CODE" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'Files that need a build:\n%s\n' "${CODE:-none}"

  build:
    # This name is the required check on main. A job skipped by `if` reports success,
    # so docs-only pull requests can still merge. If the change check itself fails,
    # build anyway: a skipped build must never stand in for a broken check.
    name: Build & self-check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned so a runner image update can't change the toolchain under us.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      # Sparkle's binary download is the slow part of a clean build; SwiftPM still
      # checks it against the checksum in Sparkle's Package.swift.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Slateflow.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build (Debug, unsigned)
        run: |
          xcodebuild -project Slateflow.xcodeproj -scheme Slateflow \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Self-check
        run: build/Build/Products/Debug/Slateflow.app/Contents/MacOS/Slateflow --selftest

      # Release compiles without DEBUG code (the self-check) and for both architectures;
      # catch failures here rather than in Tools/make-dmg.sh. Unsigned: no secrets in CI.
      - name: Build (Release, universal, unsigned)
        run: |
          xcodebuild -project Slateflow.xcodeproj -scheme Slateflow \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
