name: Release (sign, notarize, publish)
run-name: Release ${{ github.ref_name }}

# Pushing a tag vX.Y.Z (or vX.Y.Z-alpha.N / -beta.N / -rc.N, published as a pre-release) builds, signs, notarizes and publishes Slateflow X.Y.Z (ADR-0007):
#   preflight - checks with no secrets, on Ubuntu, reusing CI's result for the commit;
#   release   - signs and notarizes in the protected `release-signing` environment;
#   publish   - creates the GitHub release, then the Sparkle feed on gh-pages.
# Signing secrets never reach the job that can write to the repository.

on:
  push:
    tags: ['v[0-9]*']

permissions: {}

concurrency:
  group: release-signing
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, version and changelog
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] \
            || { echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-alpha|beta|rc.N"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          MARKETING="$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' Slateflow.xcodeproj/project.pbxproj | cut -d' ' -f3 | tr -d '"')"
          [[ "$MARKETING" == "$VERSION" ]] \
            || { echo "::error::MARKETING_VERSION is $MARKETING, tag is $VERSION"; exit 1; }
          grep -qE "^## $VERSION - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated '## $VERSION - YYYY-MM-DD' heading"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Reuse CI instead of rebuilding here: macOS runners are scarce, and CI already
      # built this exact commit when it was pushed to main.
      - name: Build & self-check passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Build%20%26%20self-check" \
            --jq '[.check_runs[].conclusion] | if index("success") then "success" elif length == 0 then "missing" else (.[0] // "running") end')"
          case "$RESULT" in
            success) ;;
            skipped) echo "::notice::CI skipped this docs-only commit; the signing job still builds Release." ;;
            missing) echo "::error::No Build & self-check run for $GITHUB_SHA. Push it to main and let CI finish first."; exit 1 ;;
            running) echo "::error::Build & self-check hasn't finished for $GITHUB_SHA. Re-run this release when it has."; exit 1 ;;
            *)       echo "::error::Build & self-check is '$RESULT' for $GITHUB_SHA."; exit 1 ;;
          esac

  release:
    name: Sign & notarize
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer   # same Xcode as CI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the build number is the commit count
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      - name: Import signing credentials
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          base64 --decode <<<"$SIGNING_CERT_P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in SIGNING_CERT_P12"; exit 1; }
          printf '%s' "$NOTARY_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          chmod 600 "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Fetch the current Sparkle feed
        run: |
          mkdir -p out
          # First release: no gh-pages branch yet, so the feed starts empty.
          git fetch --depth 1 origin gh-pages 2>/dev/null \
            && git show FETCH_HEAD:appcast.xml > out/appcast.xml 2>/dev/null || rm -f out/appcast.xml

      - name: Build, sign, notarize, update feed
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
          APPCAST: out/appcast.xml
        run: ./Tools/make-dmg.sh

      - name: Stage release files
        run: |
          DMG="dist/Slateflow-$VERSION.dmg"
          [[ -f "$DMG" ]] || { echo "::error::make-dmg.sh built a different version than $VERSION"; exit 1; }
          cp "$DMG" out/
          # Notes: the changelog section for this version, without its heading.
          awk -v v="## $VERSION - " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > out/notes.md
          (cd out && shasum -a 256 "Slateflow-$VERSION.dmg" appcast.xml > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 1

      - name: Remove signing credentials
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"

  publish:
    name: Publish
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - name: Verify files
        run: cd out && shasum -a 256 -c SHA256SUMS

      - name: Check the tag hasn't moved
        run: |
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          [[ "$TAG_SHA" == "$GITHUB_SHA" ]] || { echo "::error::$GITHUB_REF_NAME moved since signing"; exit 1; }

      # The release goes up before the feed, so apps never see an update they can't download.
      - name: Create GitHub release
        run: |
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "out/Slateflow-$VERSION.dmg" \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${PRERELEASE[@]}" \
            --title "Slateflow $VERSION" --notes-file out/notes.md

      - name: Publish the Sparkle feed to gh-pages
        run: |
          git init -q pages && cd pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          if git fetch -q --depth 1 origin gh-pages; then git checkout -q -b gh-pages FETCH_HEAD; else git checkout -q --orphan gh-pages; fi
          cp ../out/appcast.xml appcast.xml
          touch .nojekyll
          git add appcast.xml .nojekyll
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Appcast: Slateflow $VERSION"
          git push -q origin gh-pages
